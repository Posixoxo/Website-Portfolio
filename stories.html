<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Dispatch // Reader</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <style>
        .story-page-wrapper {
            max-width: 850px;
            margin: 140px auto 80px auto;
            padding: 0 20px;
        }
        .terminal-reader-box {
            background: linear-gradient(145deg, #16100d 0%, #0d0a08 100%);
            border: 1px solid rgba(204, 160, 151, 0.2);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            overflow: hidden;
            /* Give it a stable minimum height so it never collapses or snaps abruptly */
            min-height: 280px;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }
        .terminal-reader-header {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--text-accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @media (max-width: 375px) {
            .terminal-reader-header { font-size: 7px; }
        }

        @media (min-width: 425px) {
            .terminal-reader-header { font-size: 10px; }
        }

        .terminal-reader-box {
            background: linear-gradient(145deg, #16100d 0%, #0d0a08 100%);
            border: 1px solid rgba(204, 160, 151, 0.2);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            overflow: hidden;
            transition: all 0.4s ease;
            animation: borderPulse 1.5s infinite ease-in-out;
        }

        /* Subtle pulsing border effect while loading */
        .terminal-reader-box.loading {
            animation: borderPulse 1.5s infinite ease-in-out;
        }

        @keyframes borderPulse {
            0%, 100% { border-color: rgba(204, 160, 151, 0.2); }
            50% { border-color: rgba(204, 160, 151, 0.8); }
        }

        .terminal-reader-body {
            padding: 40px;
            text-align: justify;
            /* Smooth fade-in wrapper for incoming text */
            animation: contentFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes contentFadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #story-title {
            color: var(--offwhite);
            font-size: 2rem;
            margin: 15px 0 15px 0;
            letter-spacing: -0.5px;
        }
        .category-lane-badge {
            display: inline-block;
            background: rgba(204, 160, 151, 0.12);
            border: 1px solid rgba(204, 160, 151, 0.3);
            color: var(--text-accent);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
        }
        .content-line-divider {
            border: none;
            border-top: 1px dashed rgba(204, 160, 151, 0.25);
            margin: 20px 0;
        }
        .content-paragraph {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.9;
            font-family: inherit;
            margin: 0;
        }
        .reader-actions-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .reader-action-link {
            color: var(--text-accent);
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
        }

        @media (max-width: 375px) {
            .reader-action-link { font-size: 8px; }
        }

        @media (min-width: 425px) {
            .reader-action-link { font-size: 11px; }
        }

        .reader-action-link:hover {
            text-decoration: underline;
        }
        .archive-item {
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .archive-item:last-child {
            border-bottom: none;
        }
        .archive-meta {
            font-size: 11px;
            color: var(--text-accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .archive-title-link {
            color: var(--offwhite);
            font-size: 1.3rem;
            text-decoration: none;
            font-weight: 700;
        }
        .archive-title-link:hover {
            color: var(--text-accent);
        }
        .category-filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--offwhite);
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
        }
        .filter-btn:hover, .filter-btn.active {
            border-color: var(--text-accent);
            color: var(--text-accent);
        }
    </style>
</head>
<body>

            <div class="nav-links" id="navLinks">
                <a href="index.html">Home</a>

    <!-- Desktop Navigation Header -->
    <header class="desktop-version">
        <nav class="nav3">
            <div class="nav-links1">
                <a href="index.html">Home</a>
                <a href="project.html">Projects</a>
                <a href="About.html">About</a>
                <a href="contact.html" class="cont">Contact</a>
                <a href="admin.html" style="color: var(--text-accent); font-size: 12px; letter-spacing: 1px;">[ADMIN]</a>
            </div>

            <button class="theme-toggle" aria-label="Toggle theme">
                <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </nav>
    </header>

    <!-- Main Content Reader / Archive View -->
    <main class="story-page-wrapper">
        <div class="terminal-reader-box loading" id="terminal-box">
            <div class="terminal-reader-header">
                <span id="header-mode-label">// SYSTEM_DISPATCH_STREAM</span>
                <span id="header-status">CONNECTION: SECURE</span>
            </div>
            <div class="terminal-reader-body" id="reader-main-content">
                <h1 id="story-title">Loading Dispatch...</h1>
                <hr class="content-line-divider">
                <div id="story-content">Fetching payload from Firebase database node...</div>
            </div>
        </div>
        
        <!-- Navigation Actions Footer -->
        <div class="reader-actions-footer">
            <a href="index.html" class="reader-action-link">&larr; Back to Portfolio Home</a>
            <a href="stories.html?view=all" class="reader-action-link" id="toggle-archive-btn">View All Stories & Categories &rarr;</a>
        </div>
    </main>

    <!-- Firebase Reader & Archive Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBSEbRuhTdyStc1sb-IVfVsbRDrl6e8iZs",
            authDomain: "website-portfolio-c8b26.firebaseapp.com",
            databaseURL: "https://website-portfolio-c8b26-default-rtdb.firebaseio.com",
            projectId: "website-portfolio-c8b26",
            storageBucket: "website-portfolio-c8b26.firebasestorage.app",
            messagingSenderId: "905689661553",
            appId: "1:905689661553:web:1c1749dbcc75b4a16b9bd0",
            measurementId: "G-3WLRVBRND8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const readerBody = document.getElementById('reader-main-content');
        const headerLabel = document.getElementById('header-mode-label');
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        const viewAll = urlParams.get('view') === 'all';
        const terminalBox = document.getElementById('terminal-box');

        // Smooth content injection helper to prevent rigid snapping
        function injectContent(htmlString) {
            readerBody.style.animation = 'none';
            readerBody.offsetHeight; // Trigger reflow to restart animation
            readerBody.innerHTML = htmlString;
            readerBody.style.animation = 'contentFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards';
        }

        async function initReader() {
            try {
                const dbRef = ref(db);
                const snapshot = await get(child(dbRef, `posts`));
                
                // Remove loading border pulse once loaded
                if (terminalBox) terminalBox.classList.remove('loading');

                if (!snapshot.exists()) {
                    injectContent(`<h1>No Records Found</h1><hr class="content-line-divider"><p>The database contains no dispatches.</p>`);
                    return;
                }

                const allPosts = snapshot.val();

                if (viewAll || !postId) {
                    renderArchiveView(allPosts);
                } else {
                    renderSinglePost(allPosts[postId]);
                }
            } catch (err) {
                console.error(err);
                if (terminalBox) terminalBox.classList.remove('loading');
                injectContent(`<h1>Connection Error</h1><hr class="content-line-divider"><p>Failed to retrieve data stream from Firebase.</p>`);
            }
        }

        function renderSinglePost(post) {
            if (!post) {
                injectContent(`<h1>404 - Dispatch Not Found</h1><hr class="content-line-divider"><p>The requested post ID key does not exist in the database tree.</p>`);
                return;
            }

            headerLabel.textContent = `// CATEGORY: ${post.category.toUpperCase()}`;
            
            const paragraphs = post.content.split(/\r?\n/).filter(p => p.trim().length > 0);
            let structuredContentHTML = '';
            
            paragraphs.forEach((para, index) => {
                structuredContentHTML += `<p class="content-paragraph">${para}</p>`;
                if (index < paragraphs.length - 1) {
                    structuredContentHTML += `<hr class="content-line-divider">`;
                }
            });
            
            injectContent(`
                <div class="category-lane-badge">// ${post.category.toUpperCase()}</div>
                <span style="display: block; color: var(--text-accent); font-size: 11px; text-transform: uppercase; margin-bottom: 5px;">TIMESTAMP: ${new Date(post.createdAt).toLocaleDateString()}</span>
                <h1 id="story-title">${post.title}</h1>
                <hr class="content-line-divider">
                <div id="story-content-blocks">${structuredContentHTML}</div>
            `);
        }

        function renderArchiveView(postsObj) {
            headerLabel.textContent = `// SYSTEM_DISPATCH_ARCHIVE`;
            
            const publishedPosts = Object.entries(postsObj)
                .map(([id, p]) => ({ id, ...p }))
                .filter(p => p.status === 'published');

            if (publishedPosts.length === 0) {
                injectContent(`<h1>Dispatch Archive</h1><hr class="content-line-divider"><p>No published posts currently available.</p>`);
                return;
            }

            let html = `
                <div class="category-lane-badge">// ALL CATEGORIES ARCHIVE</div>
                <h1 style="font-size: 1.8rem; color: var(--offwhite); margin-bottom: 10px;">All Dispatches & Writings</h1>
                <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 25px;">Browse all technical notes, IT berries, and stories categorized below.</p>
                
                <div class="category-filter-bar">
                    <button class="filter-btn active" onclick="filterCategory('All', this)">All (${publishedPosts.length})</button>
                    <button class="filter-btn" onclick="filterCategory('IT Berries', this)">IT Berries</button>
                    <button class="filter-btn" onclick="filterCategory('Technical Writeup', this)">Technical Writeups</button>
                    <button class="filter-btn" onclick="filterCategory('Documentation', this)">Documentation</button>
                    <button class="filter-btn" onclick="filterCategory('Personal Story', this)">Personal Stories</button>
                </div>
                <hr class="content-line-divider">
                <div id="archive-list-container">
            `;

            publishedPosts.forEach(post => {
                html += `
                    <div class="archive-item" data-category="${post.category}">
                        <div class="archive-meta">// ${post.category.toUpperCase()} &bull; ${new Date(post.createdAt).toLocaleDateString()}</div>
                        <a href="stories.html?id=${post.id}" class="archive-title-link">${post.title}</a>
                        <p style="color: var(--text-secondary); font-size: 13.5px; margin: 8px 0 12px 0; line-height: 1.6;">${post.excerpt || post.content.substring(0, 160) + '...'}</p>
                        <a href="stories.html?id=${post.id}" style="display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-accent); text-decoration: none; font-weight: bold; border: 1px solid rgba(204, 160, 151, 0.3); padding: 5px 12px; border-radius: 4px; background: rgba(204, 160, 151, 0.05); transition: all 0.2s;">Full Read &rarr;</a>
                        <hr class="content-line-divider" style="margin-top: 20px;">
                    </div>
                `;
            });

            html += `</div>`;
            injectContent(html);

            window.filterCategory = function(cat, btnElement) {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');

                const items = document.querySelectorAll('.archive-item');
                items.forEach(item => {
                    if (cat === 'All' || item.getAttribute('data-category') === cat) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                });
            };
        }

        const toggleArchiveBtn = document.getElementById('toggle-archive-btn');
        if (toggleArchiveBtn) {
            if (viewAll) {
                toggleArchiveBtn.style.display = 'none';
            } else {
                toggleArchiveBtn.href = 'stories.html?view=all';
            }
        }

        initReader();
    </script>
    <script src="script.js"></script>
</body>
</html>
