<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Admin // CMS Terminal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body.admin-body {
            background-color: #080808;
            color: #00ff88;
            font-family: 'JetBrains Mono', monospace;
            padding: 20px;
        }
        .terminal-container {
            max-width: 900px;
            margin: 40px auto;
            background: #111;
            border: 1px solid #222;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        .terminal-header {
            background: #1a1a1a;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #282828;
            font-size: 13px;
            color: #888;
        }
        .terminal-dots span {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }
        .terminal-body {
            padding: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #cca097;
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            border-radius: 4px;
            box-sizing: border-box;
            resize: none;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #00ff88;
            outline: none;
        }
        .terminal-btn {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-weight: bold;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            border-radius: 4px;
            transition: opacity 0.2s;
        }
        .terminal-btn:hover {
            opacity: 0.85;
        }
        #login-screen, #dashboard-screen {
            display: none;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            font-size: 11px;
            border-radius: 3px;
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        @media (min-width: 300px) {
            #connection-status {
                font-size: 7px;
            }
        }

        @media (max-width: 425px) {
            #connection-status {
                font-size: 11px;
            }
        }

        @media (min-width: 300px) {
            .status-badge {
                font-size: 7px;
            }
        }

        @media (max-width: 300px) {
            .status-badge {
                font-size: 11px;
            }
        }

        /* Terminal Toast Notification UI */
        #terminal-toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #111;
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 14px 20px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 9999;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        #terminal-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        #terminal-toast.error {
            border-color: #ff5f56;
            color: #ff5f56;
        }




    </style>
</head>
<body class="admin-body">
    <div id="terminal-toast">[SYSTEM_READY]</div>

    <div class="terminal-container">
        <div class="terminal-header">
            <div class="terminal-dots">
                <a href="index.html"><span class="dot-red"></span></a>
                <span class="dot-yellow"></span>
                <span class="dot-green"></span>
            </div>
            <div id="connection-status">STATUS: <span class="status-badge">SECURE_OFFLINE</span></div>
        </div>

        <div class="terminal-body">
            <!-- LOGIN VIEW -->
            <div id="login-screen">
                <h2>root@portfolio-cms:~$ auth_required</h2>
                <p style="color: #666; font-size: 13px; margin-bottom: 20px;">Enter administrative credentials to mount write permissions.</p>
                <form id="login-form">
                    <div class="form-group">
                        <label>Admin Email</label>
                        <input type="email" id="admin-email" required placeholder="admin@domain.com">
                    </div>
                    <div class="form-group">
                        <label>Password / Passkey</label>
                        <input type="password" id="admin-password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="terminal-btn">AUTHENTICATE &gt;&gt;</button>
                </form>
            </div>

            <!-- DASHBOARD / CRUD EDITOR VIEW -->
            <div id="dashboard-screen">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                    <h2 style="margin:0; font-size: 11px; color: #fff;">// CMS CONTENT MUTATOR & DATABASE</h2>
                    <button id="logout-btn" style="background: transparent; color: #ff5f56; border: 1px solid #ff5f56; padding: 6px 12px; cursor: pointer; font-family: inherit;">LOGOUT</button>
                </div>

                <!-- Create / Edit Form -->
                <form id="post-form" style="margin-bottom: 40px; border-bottom: 1px solid #222; padding-bottom: 30px;">
                    <input type="hidden" id="edit-post-id">
                    <div class="form-group">
                        <label id="form-mode-label">Article Title / Berry Title</label>
                        <input type="text" id="post-title" required placeholder="e.g. Eye Strain Optimization 101">
                    </div>
                    <div class="form-group">
                        <label>Short Excerpt / Preview Summary</label>
                        <textarea id="post-excerpt" rows="2" required placeholder="A brief 1-2 sentence preview for the homepage card..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="post-category">
                            <option value="IT Berries">IT Berries</option>
                            <option value="Technical Writeup">Technical Writeup</option>
                            <option value="Documentation">Documentation</option>
                            <option value="Personal Story">Personal Story</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Content Body</label>
                        <textarea id="post-content" rows="5" required placeholder="Write your thoughts or technical breakdown here..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Visibility Status</label>
                        <select id="post-status">
                            <option value="published">Published (Live on site)</option>
                            <option value="draft">Draft (Hidden)</option>
                        </select>
                    </div>
                    <button type="submit" id="submit-btn" class="terminal-btn">+ COMMIT POST TO DATABASE</button>
                    <button type="button" id="cancel-edit-btn" style="display: none; background: #333; color: #fff; border: none; padding: 12px 16px; margin-left: 10px; cursor: pointer; font-family: inherit;">CANCEL</button>
                </form>

                <!-- Existing Posts Manager Table -->
                <h3 style="font-size: 1rem; color: #cca097; margin-bottom: 15px;">// EXISTING DATABASE RECORDS</h3>
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 12px;">
                        <thead>
                            <tr style="border-bottom: 1px solid #333; color: #666;">
                                <th style="padding: 10px;">TITLE</th>
                                <th style="padding: 10px;">CATEGORY</th>
                                <th style="padding: 10px;">STATUS</th>
                                <th style="padding: 10px; text-align: right;">ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody id="admin-posts-table-body">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBSEbRuhTdyStc1sb-IVfVsbRDrl6e8iZs",
            authDomain: "website-portfolio-c8b26.firebaseapp.com",
            databaseURL: "https://website-portfolio-c8b26-default-rtdb.firebaseio.com",
            projectId: "website-portfolio-c8b26",
            storageBucket: "website-portfolio-c8b26.firebasestorage.app",
            messagingSenderId: "905689661553",
            appId: "1:905689661553:web:1c1749dbcc75b4a16b9bd0",
            measurementId: "G-3WLRVBRND8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const loginScreen = document.getElementById('login-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const statusBadge = document.querySelector('.status-badge');
        const tableBody = document.getElementById('admin-posts-table-body');
        const postForm = document.getElementById('post-form');
        const editPostIdInput = document.getElementById('edit-post-id');
        const submitBtn = document.getElementById('submit-btn');
        const cancelEditBtn = document.getElementById('cancel-edit-btn');
        const formModeLabel = document.getElementById('form-mode-label');
        const logoutBtn = document.getElementById('logout-btn');
        const loginForm = document.getElementById('login-form');
        const toast = document.getElementById('terminal-toast');

        // Terminal Toast Notification Engine
        function showToast(message, isError = false) {
            if (!toast) return;
            toast.textContent = `// ${message}`;
            toast.className = isError ? 'error show' : 'show';
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginScreen.style.display = 'none';
                dashboardScreen.style.display = 'block';
                statusBadge.textContent = `CONNECTED: ${user.email}`;
                statusBadge.style.color = '#00ff88';
                loadAdminPosts();
            } else {
                loginScreen.style.display = 'block';
                dashboardScreen.style.display = 'none';
                statusBadge.textContent = 'RESTRICTED_ACCESS';
                statusBadge.style.color = '#ff5f56';
            }
        });

        // Login Handler with State Pipeline
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const authBtn = loginForm.querySelector('button[type="submit"]');
            const originalText = authBtn.textContent;
            
            authBtn.textContent = 'AUTHENTICATING...';
            authBtn.style.opacity = '0.6';
            authBtn.disabled = true;

            try {
                await signInWithEmailAndPassword(auth, document.getElementById('admin-email').value, document.getElementById('admin-password').value);
                showToast('AUTHENTICATION_SUCCESSFUL // WELCOME_ROOT');
            } catch (err) {
                showToast('AUTH_FAILED: ' + err.message, true);
                authBtn.textContent = originalText;
                authBtn.style.opacity = '1';
                authBtn.disabled = false;
            }
        });

        // Logout Handler with State Pipeline
        logoutBtn.addEventListener('click', async () => {
            const originalText = logoutBtn.textContent;
            logoutBtn.textContent = 'DISCONNECTING...';
            logoutBtn.style.opacity = '0.6';
            logoutBtn.disabled = true;

            try {
                await signOut(auth);
                showToast('SESSION_TERMINATED');
            } catch (err) {
                showToast('LOGOUT_ERROR: ' + err.message, true);
                logoutBtn.textContent = originalText;
                logoutBtn.style.opacity = '1';
                logoutBtn.disabled = false;
            }
        });

        function loadAdminPosts() {
            const postsRef = ref(db, 'posts');
            onValue(postsRef, (snapshot) => {
                const data = snapshot.val();
                tableBody.innerHTML = '';
                if (!data) {
                    tableBody.innerHTML = `<tr><td colspan="4" style="padding: 15px; color: #555; text-align: center;">No records found in database.</td></tr>`;
                    return;
                }
                Object.entries(data).forEach(([id, post]) => {
                    const tr = document.createElement('tr');
                    tr.style.borderBottom = '1px solid #1a1a1a';
                    tr.innerHTML = `
                        <td style="padding: 12px; color: #fff;">${post.title}</td>
                        <td style="padding: 12px; color: #cca097;">${post.category}</td>
                        <td style="padding: 12px;"><span style="color: ${post.status === 'published' ? '#00ff88' : '#ffbd2e'}">${post.status}</span></td>
                        <td style="padding: 20px 4px 20px 15px; text-align: right; display: flex; justify-content: flex-end;">
                            <button onclick="window.editPost('${id}', '${encodeURIComponent(post.title)}', '${encodeURIComponent(post.excerpt || '')}', '${post.category}', '${encodeURIComponent(post.content)}', '${post.status}')" style="background:none; border:none; color:#00ff88; cursor:pointer; margin-right:10px; font-size: 11px;">[EDIT]</button>
                            <button onclick="window.deletePost('${id}', this)" style="background:none; border:none; color:#ff5f56; cursor:pointer; font-size: 11px;;">[DEL]</button>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });
            });
        }

        window.editPost = function(id, title, excerpt, category, content, status) {
            editPostIdInput.value = id;
            document.getElementById('post-title').value = decodeURIComponent(title);
            document.getElementById('post-excerpt').value = decodeURIComponent(excerpt);
            document.getElementById('post-category').value = category;
            document.getElementById('post-content').value = decodeURIComponent(content);
            document.getElementById('post-status').value = status;
            submitBtn.textContent = 'UPDATE RECORD >>';
            cancelEditBtn.style.display = 'inline-block';
            formModeLabel.textContent = `Editing Post ID: ${id}`;
            showToast(`LOADED_RECORD: ${id}`);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        cancelEditBtn.addEventListener('click', () => {
            postForm.reset();
            editPostIdInput.value = '';
            submitBtn.textContent = '+ COMMIT POST TO DATABASE';
            cancelEditBtn.style.display = 'none';
            formModeLabel.textContent = 'Article Title / Berry Title';
            showToast('EDIT_CANCELLED');
        });

        // Delete Handler with Button Feedback State
        window.deletePost = async function(id, btnElement) {
            if (confirm('Are you sure you want to delete this record from the database?')) {
                const originalText = btnElement.textContent;
                btnElement.textContent = '[DEL...]';
                btnElement.style.opacity = '0.5';
                
                try {
                    await remove(ref(db, `posts/${id}`));
                    showToast(`RECORD_DELETED: ${id}`);
                } catch (err) {
                    showToast('DELETE_FAILED: ' + err.message, true);
                    btnElement.textContent = originalText;
                    btnElement.style.opacity = '1';
                }
            }
        };

        // Post Form Submit / Commit Handler with State Pipeline
        postForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = editPostIdInput.value;
            const originalBtnText = submitBtn.textContent;

            submitBtn.textContent = id ? 'UPDATING_RECORD...' : 'COMMITTING_TO_DATABASE...';
            submitBtn.style.opacity = '0.6';
            submitBtn.disabled = true;

            const postData = {
                title: document.getElementById('post-title').value,
                excerpt: document.getElementById('post-excerpt').value, // Fixed bracket to parenthesis here
                category: document.getElementById('post-category').value,
                content: document.getElementById('post-content').value,
                status: document.getElementById('post-status').value,
                updatedAt: Date.now()
            };

            try {
                if (id) {
                    await update(ref(db, `posts/${id}`), postData);
                    showToast('RECORD_UPDATED_SUCCESSFULLY');
                } else {
                    postData.createdAt = Date.now();
                    const newRef = push(ref(db, 'posts'));
                    await set(newRef, postData);
                    showToast('NEW_DISPATCH_COMMITTED');
                }
                postForm.reset();
                editPostIdInput.value = '';
                submitBtn.textContent = '+ COMMIT POST TO DATABASE';
                cancelEditBtn.style.display = 'none';
                formModeLabel.textContent = 'Article Title / Berry Title';
            } catch (err) {
                showToast('DATABASE_WRITE_ERROR: ' + err.message, true);
            } finally {
                submitBtn.style.opacity = '1';
                submitBtn.disabled = false;
                if (!id) submitBtn.textContent = originalBtnText;
            }
        });
    </script>
</body>
</html>
